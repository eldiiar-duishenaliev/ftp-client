[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-ftp-client"
version = "1.0.0"
description = "A native-feeling FTP, FTPS and SFTP desktop client for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "paramiko>=3.4",
    "keyring>=24",
]

[project.optional-dependencies]
dev = [
    "pyftpdlib>=2.0",
    "pyopenssl>=24",
    "Pillow>=10",
    "ruff>=0.6",
]

[project.scripts]
ftpclient = "ftpclient.__main__:main"

[tool.setuptools.packages.find]
include = ["ftpclient*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",  # cleanup paths intentionally swallow every exception
    "S110",    # same
    "SIM115",  # files are opened once and wrapped in a with block later
    "UP035",   # typing.Callable is fine for Python 3.11+
    "UP037",
    "UP017",
    "PYI034",
    "PYI041",
]
